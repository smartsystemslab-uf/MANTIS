[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mantis"
version = "0.1.0"
description = "MANTIS - Modular Agent Network Testbed for Instrumentation and Security"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk==2.7.1",
    "litellm==1.97.0",
    "python-dotenv==1.0.1",
    "mcp==1.29.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "mlflow==3.15.2",
    "matplotlib==3.11.1",
    "pandas==2.3.3",
]

[project.optional-dependencies]
dev = [
    "flake8",
    "black"
]
exporters = [
    "opentelemetry-exporter-otlp-proto-grpc==1.42.1",
    "opentelemetry-exporter-otlp-proto-http==1.42.1"
]
ui = [
    "fastapi",
    "uvicorn"
]
# There is deliberately no `zero_trust` extra here. The Backplane's 2026-10
# rewrite (v1.0.0/v1.0.1) replaced the old task-specific PDP microservice
# with a generic Zero Trust system for any Google ADK application: a real
# `ZeroTrustPlugin`, built from ~7 packages that locate their own data files
# (schemas, policy templates, dev keys) with `Path(__file__).resolve()`
# relative to a *source checkout* -- every one of them requires an editable
# install from a real clone, which a declarative `name @ git+URL` dependency
# here cannot express (confirmed: a non-editable wheel build of zt-interface
# alone fails at runtime looking for its schema under site-packages, not
# where it actually ships). extensions/zero_trust/setup.sh does the editable
# installs from the pinned submodule at extensions/zero_trust/backplane
# (tag v1.0.1), exactly mirroring the upstream project's own documented
# install recipe.
aml = [
    "networkx>=3.0"
]

[project.scripts]
mantis = "mantis.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
