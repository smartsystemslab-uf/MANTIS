[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mantis"
version = "0.1.0"
description = "MANTIS - Modular Agent Network Testbed for Instrumentation and Security"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk==2.7.1",
    "litellm==1.97.0",
    "python-dotenv==1.0.1",
    "mcp==1.29.0",
    "pytest==9.1.1",
    "pyyaml==6.0.3",
    "mlflow==3.15.2",
    "matplotlib==3.11.1",
    "pandas==2.3.3",
]

[project.optional-dependencies]
dev = [
    "flake8",
    "black"
]
exporters = [
    "opentelemetry-exporter-otlp-proto-grpc==1.42.1",
    "opentelemetry-exporter-otlp-proto-http==1.42.1"
]
ui = [
    "fastapi",
    "uvicorn"
]

[project.scripts]
mantis = "mantis.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
