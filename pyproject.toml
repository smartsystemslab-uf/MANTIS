[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mantis"
version = "0.1.0"
description = "MANTIS - Modular Agent Network Testbed for Instrumentation and Security"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-adk>=1.18.0",
    "litellm>=1.67.0",
    "python-dotenv>=1.0.1",
    "mcp",
    "pytest",
    "pyyaml"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "flake8",
    "black"
]

[project.scripts]
mantis = "mantis.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
