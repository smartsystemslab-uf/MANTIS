experiment:
  name: wp6_mock_llm_overhead_off
  seed: 42
  domain: front_office
  workflow: front_office_transaction_execution
  scenario: front_office_transaction_execution

observability:
  mode: "off"
  export: []

benchmark:
  # concurrency: 1 (serial) is deliberate here -- this config exists to
  # isolate instrumentation cost by diffing against *_full, and any
  # concurrency > 1 adds shared-CPU contention noise between the parallel
  # subprocess launches that has nothing to do with instrumentation and
  # would inflate both sides' latency by the same confound. Concurrency's
  # own effect on latency/throughput is what wp6_benchmark_volume_scaling
  # exists to measure instead.
  concurrency: 1
  repetitions: 20
  mock_llm: true
