# Starter campaign 2_defenses: Each of the six defenses, run against the attack it is built to stop.
# Copy of configs/extensions/guardrail_blocks_back_office_mutation.yaml under a camp_ name, so a campaign never overwrites recorded paper evidence.
# Post-Paper Extension demo: a security-mechanism plugin (coding plan
# §11) evaluated through the exact same experiment framework as an
# attack. Same attack as configs/attacks/wp5_back_office_tool_mutation.yaml
# (redirects a validated ledger post from EOD-2026-04-21-CLEAN onto the
# real, already-mismatched EOD-2026-04-21-MISMATCH batch), but with
# batch_integrity_guard also registered: it independently re-checks the
# target batch's own real expected-vs-posted totals and denies the ledger
# update if that batch already carries an unresolved discrepancy --
# regardless of which batch_id the (already-mutated) tool call names.
#
# This is the second attack in the whole catalog that, undefended,
# succeeds 5/5 with zero resistance (route confusion was the first; see
# guardrail_blocks_route_confusion.yaml). This config demonstrates the
# second real defense, closing out the security-mechanism-plugins
# extension against every currently-undefended attack in the catalog.
experiment:
  name: camp_2_batch_integrity_guard
  seed: 107
  domain: back_office
  workflow: back_office_clean
  scenario: back_office_clean

attack:
  plugin: tool_mutation
  control_point: tool
  target: apply_ledger_updates
  parameters:
    target_tool: apply_ledger_updates
    mutated_parameters:
      batch_id: EOD-2026-04-21-MISMATCH

policies:
  - plugin: batch_integrity_guard
    parameters:
      target_tool: apply_ledger_updates

observability:
  mode: full
  export: [jsonl]

# The guard denies the mutated ledger post outright, so apply_ledger_updates
# is recorded as attempted (TOOL_CALL / POLICY_EVENT) but never actually
# updates the wrong batch's status -- there is no successful terminal
# state to expect here the way there is for an undefended run, the same
# honest pattern as guardrail_blocks_tool_mutation.yaml.
evaluation:
  expected_tools:
    - apply_ledger_updates
