# Zero Trust + AML office together (see extensions/zero_trust/README.md
# and src/mantis/banking/aml_office/). The AML office router is a 4th
# sub_agent, which changes the live agent/tool graph's fingerprint -- a
# run with both toggles enabled needs the bundle built against the
# AML-enabled application factory (extensions/zero_trust/zt_adk_aml.yaml),
# not the one zero_trust_demo.yaml uses; build_zero_trust_plugin's own
# enable_aml flag (threaded from this config's aml_office: block) picks
# it automatically. No attack here on purpose: this config shows both
# toggles' real enforcement passing a genuine AML investigation workflow
# through unchanged -- same expected tool, same real detection -- while
# every real tool call is also checked by the real Zero Trust plugin.
#
# CUST-001 has three seeded inbound wires from the same counterparty
# within a 7-day window summing to $12,000, past detect_structuring's
# default $10,000 threshold -- a real, reproducible positive case.
experiment:
  name: zero_trust_aml_combined_demo
  seed: 121
  domain: aml_office
  workflow: aml_office_structuring_investigation
  scenario: aml_office_structuring_investigation

zero_trust:
  enabled: true

aml_office:
  enabled: true

observability:
  mode: full
  export: [jsonl]

evaluation:
  expected_tools:
    - detect_structuring
