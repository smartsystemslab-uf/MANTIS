packages:
  - citi_banking_adk
  - citi_banking_mcp_server
  - citi_banking_backend
  - citi_banking_adk_mlflow_observability

launch_steps:
  adk_runner: "python run_scenarios.py --scenario <name>"
  mcp_server: "python mcp_server.py"
  backend: "python -m uvicorn app.main:app --host 127.0.0.1 --port 8000"

agents:
  front_office:
    - user_proxy_agent
    - front_office_router
    - front_office_transaction_workflow
    - transaction_monitoring_agent
    - compliance_agent
    - decision_making_agent
  mid_office:
    - user_proxy_agent
    - mid_office_router
    - mid_office_planning_workflow
    - data_analysis_agent
    - support_guidance_agent
    - validation_agent
    - planning_summary_agent
  back_office:
    - user_proxy_agent
    - back_office_router
    - back_office_eod_workflow
    - validation_checkpoint_agent
    - eod_processing_agent
    - ledger_update_agent
    - reconciliation_agent
    - report_writing_agent
  root:
    - root_agent

# MCP tools: exposed by the FastMCP server to the ADK agents
mcp_tools:
  front_office:
    - get_transaction
    - run_fraud_and_compliance_workflow
    - update_transaction_status
  mid_office:
    - get_branch_workload
    - propose_staffing_adjustment
    - get_customer_product_affinity
  back_office:
    - trigger_eod_reconciliation
    - get_reconciliation_mismatches
    - resolve_ledger_entry

# Internal ADK tools: called by the agents during actual execution (observed in golden runs)
adk_tools:
  front_office:
    - get_customer_context
    - get_transaction_context
    - search_policies
    - submit_manual_review
  mid_office:
    - get_operations_snapshot
    - get_support_playbooks
    - persist_validated_schedule
  back_office:
    - validate_eod_readiness
    - get_eod_batch
    - apply_ledger_updates
    - get_reconciliation_data
    - store_report

workflows:
  - front_office_monitoring
  - front_office_chatbot
  - front_office_transaction_execution
  - mid_office_planning
  - mid_office_rep_assist
  - back_office_clean
  - back_office_mismatch

telemetry_paths:
  - stdout traces (ADK)
  - mlflow exports (citi_banking_adk_mlflow_observability)

data_stores:
  - backend/data/citi_banking.db
