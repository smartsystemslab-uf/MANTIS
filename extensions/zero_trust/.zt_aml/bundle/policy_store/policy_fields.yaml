  input_message:
    kind: request
    default_deny: false
    description: Every user message (text or a function response sent by the client)
      before any agent sees it.
    events:
      input_received: '*'
    fields:
      session.present:
        type: bool
        source: 'runtime: the run has a session id'
      user.role:
        type: string
        source: 'runtime: role asserted by the authenticated ingress ('''' when unknown)'
      entry.agent:
        type: string
        source: 'runtime: agent the message starts or resumes'
      input.kind:
        type: string
        source: 'runtime: ''text'' or ''function_response'''
      input.length:
        type: int
        source: 'runtime: characters of the message text'
      input.prompt_injection_detected:
        type: bool
        source: 'content inspector: prompt-injection pattern list'
      input.contains.*:
        type: bool
        missing: false
        source: 'content inspector: detector matched (absent = false)'
  output_message:
    kind: request
    default_deny: false
    description: Every piece of user-visible agent content (streamed text is held
      until checked).
    events:
      output_emitted: '*'
    fields:
      agent.name:
        type: string
        source: 'runtime: authoring agent'
      user.role:
        type: string
        source: 'runtime: role of the run''s ingress session ('''' when unknown)'
      output.length:
        type: int
        source: 'runtime: characters of the content'
      output.prompt_injection_detected:
        type: bool
        source: content inspector
      output.contains.*:
        type: bool
        missing: false
        source: 'content inspector: detector matched (absent = false)'
  agent_message:
    kind: request
    default_deny: false
    description: The request an agent sends to another agent (AgentTool call, remote
      route).
    events:
      agent_message_sent: '*'
    fields:
      route.from:
        type: string
        source: 'runtime: calling agent'
      route.to:
        type: string
        source: 'runtime: called agent'
      message.prompt_injection_detected:
        type: bool
        source: content inspector
      message.contains.*:
        type: bool
        missing: false
        source: content inspector (absent = false)
