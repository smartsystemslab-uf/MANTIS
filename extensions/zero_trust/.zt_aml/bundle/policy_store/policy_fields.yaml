    default_deny: false
    description: Every tool call, with facts of the run that started it.
    events:
      tool_call_requested: '*'
    fields:
      tool.name:
        type: string
        source: 'runtime: tool being called'
      tool.agent:
        type: string
        source: 'runtime: authenticated / in-process agent calling the tool'
      user.role:
        type: string
        source: 'runtime: role of the run''s ingress session ('''' when unknown)'
      session.present:
        type: bool
        source: 'runtime: the run has a session id'
      run.tainted:
        type: bool
        source: 'runtime: an earlier tool result or agent message in this run was
          flagged by a content rule'
  tool_result:
    kind: request
    default_deny: false
    description: Every tool result before the model sees it (indirect prompt injection,
      data leaving a tool).
    events:
      tool_result_received: '*'
    fields:
      tool.name:
        type: string
        source: runtime
      tool.agent:
        type: string
        source: runtime
      result.prompt_injection_detected:
        type: bool
        source: content inspector
      result.contains.*:
        type: bool
        missing: false
        source: content inspector (absent = false)
  model_request:
    kind: request
    default_deny: false
    description: Every model request of an agent (built-in capabilities and function
      declarations it carries).
    events:
      model_requested: '*'
    fields:
      agent.name:
        type: string
        source: 'runtime: agent that sends the request'
      request.builtin.*:
        type: bool
        missing: false
        source: 'runtime: the request enables this model-side built-in tool (absent
          = false)'
      request.undeclared_functions:
        type: bool
        source: 'runtime: the request declares a function the bundle does not list
          for this agent'
      request.undeclared_builtins:
        type: bool
        source: 'runtime: the request enables a model-side capability no built-in
          tool of this agent declares'
  workflow_run:
    kind: temporal
    key:
    - workflow_run_id
    description: 'Trusted events of one run (one user message), observed by the component
      that runs the agents'' routes and tools. tool_admitted and agent_routed are
      checked before the step.

      '
    events:
      agent_routed:
      - route.from
      - route.to
      tool_admitted:
      - tool.agent
      - tool.name
      tool_succeeded:
      - tool.agent
      - tool.name
      - result.status
      tool_failed:
      - tool.agent
      - tool.name
    fields:
      route.from:
        type: string
        source: 'runtime: agent that starts the next agent (''ingress'' for the entry)'
      route.to:
        type: string
        source: 'runtime: agent that is started'
      tool.agent:
        type: string
        source: 'runtime: agent calling the tool'
      tool.name:
        type: string
        source: 'runtime: tool being called'
      result.status:
        type: string
        source: 'runtime: the tool result''s ''status'' field as text ('''' when absent)'
  request_attempt:
    kind: temporal
    key:
    - attempt_id
    description: One tools/call HTTP request processed by the gateway (server-generated
      attempt id).
    events:
      request_received: []
      identity_verified:
      - identity.workload_ok
      - identity.agent_registered
      - identity.agent_credential_ok
      identity_rejected: []
      run_rejected: []
      authorization_allowed: []
      authorization_denied: []
      authorization_unavailable: []
      permit_verified: []
      permit_rejected: []
      obligation_rejected: []
      execution_requested: []
      execution_admitted:
      - permit.bound
      - permit.live
      - tool.critical
      audit_pre_recorded:
      - audit.correlated
      - audit.durable
      execution_started: []
      execution_succeeded: []
      execution_failed: []
      request_denied: []
      audit_post_recorded:
      - audit.correlated
    fields:
      identity.workload_ok:
        type: bool
        source: 'gateway: verified X.509-SVID of the mTLS peer equals the authenticated
          workload'
      identity.agent_registered:
        type: bool
        source: 'gateway: agent id from the verified agent certificate, registry lists
          the peer workload'
      identity.agent_credential_ok:
        type: bool
        source: 'gateway: agent certificate chain, registry state, RFC 9421 signature,
          digest and replay window verified for THIS request'
      permit.bound:
        type: bool
        source: 'gateway: Permit Lease claims match this request (subject, resource,
          action, request hash, arguments, caller)'
      permit.live:
        type: bool
        source: 'gateway: lease unexpired and not revoked, agent credential valid'
      tool.critical:
        type: bool
        source: 'PEP plan: protected critical operation'
      audit.correlated:
        type: bool
        source: 'gateway PSL audit: record correlation fields equal the attempt''s
          bindings'
      audit.durable:
        type: bool
        source: 'gateway PSL audit: pre-execution record written and flushed (fsync
          for critical tools)'
  operation:
    kind: temporal
    key:
    - workflow_run_id
    - agent
    - tool
    - args_sha256
    description: One business operation, independent of request id, idempotency key,
      MCP session and JSON-RPC id.
    events:
      op_denied: []
      execution_admitted:
      - tool.critical
      execution_succeeded: []
      execution_failed: []
    fields:
      tool.critical:
        type: bool
        source: 'PEP plan: protected critical operation'
  workflow_participation:
    kind: temporal
    key:
    - workflow_run_id
    - agent
    description: Dispatches of one agent in one run by the gateway (entry agent or
      authorised route hop).
    events:
      dispatched: []
      dispatch_ended: []
      execution_admitted: []
    fields: {}
