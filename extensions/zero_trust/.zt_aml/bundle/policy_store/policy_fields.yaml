# Generated by zt-adk build. Part of the signed policy store.
catalog_version: 1
windows: {}
scopes:
  pdp_request:
    kind: request
    description: 'One authorization request at the PDP, evaluated after signature,
      replay and evidence verification and after subject/resource/action were resolved
      against the registries.

      '
    events:
      authz_request: '*'
    fields:
      subject.id:
        type: string
        source: PDPRequest.subject.canonical_id, resolved in the identity registry
      subject.runtime_id:
        type: string
        source: PDPRequest.subject.runtime_id (the agent name), must match the registry
          binding
      subject.type:
        type: string
        source: 'identity registry: type'
      subject.domain:
        type: string
        source: 'identity registry: domain'
      subject.role.*:
        type: bool
        missing: false
        source: 'identity registry: roles (absent role = false)'
      resource.id:
        type: string
        source: PDPRequest.resource.canonical_id, resolved in the resource catalogue
      resource.runtime_id:
        type: string
        source: PDPRequest.resource.runtime_id ('agent:<name>', '<agent>/<tool>',
          mas_input_channel, mas_output_channel)
      resource.domain:
        type: string
        source: 'resource catalogue: domain'
      resource.classification:
        type: string
        source: 'resource catalogue: classification'
      resource.critical:
        type: bool
        source: 'resource catalogue: an action of the resource is critical'
      resource.target_type:
        type: string
        source: 'resource catalogue: ''subject'' for agent targets ('''' otherwise)'
      action:
        type: string
        source: PDPRequest.action (defined for the resource)
      workflow.id:
        type: string
        source: PDPRequest.context.workflow_id ('' outside a workflow)
      workflow.verified:
        type: bool
        source: 'evidence verifier: signed workflow assertion bound to the request'
      environment:
        type: string
        source: PDPRequest.context.environment
      risk.level:
        type: enum
        values:
        - low
        - medium
        - high
        - critical
        source: 'evidence verifier: signed risk assertion'
      risk.score:
        type: int
        source: 'evidence verifier: signed risk assertion (0-1000)'
      auth.strength:
        type: int
        source: 'evidence verifier: signed authentication assertion (0-10)'
      approval.valid:
        type: bool
        source: 'evidence verifier: human approval signed by an approver key, bound
          to the request hash'
      approval.secondary_valid:
        type: bool
        source: 'evidence verifier: independent secondary authorization bound to the
          request hash'
      approval.issuer:
        type: string
        source: 'evidence verifier: issuer of the verified human approval ('''' when
          absent)'
      approval.secondary_issuer:
        type: string
        source: 'evidence verifier: issuer of the verified secondary authorization
          ('''' when absent)'
      identity.verified:
        type: bool
        source: 'evidence verifier: PEP request proof and identity evidence'
      auth.scheme:
        type: string
        source: 'signed authentication assertion: ''B'' = SPIFFE scheme B (gateway),
          ''P'' = in-process plugin, '''' when absent'
      auth.subject_kind:
        type: string
        source: 'signed authentication assertion: ''agent'' or ''service'' ('''' when
          absent)'
      auth.factor.*:
        type: bool
        missing: false
        source: 'signed authentication assertion: verified factors (absent = false)'
      auth.agent_bound:
        type: bool
        source: signed authentication assertion names the request subject's agent
      time.in.*:
        type: bool
        source: PDP clock evaluated against the catalogue's windows
      args.well_formed:
        type: bool
        source: 'PDP checker: parameters are a JSON object without null values at
          any depth'
      request.cross_domain:
        type: bool
        source: 'PDP: subject domain differs from resource domain'
      args.account_id:
        type: string
        source: 'PDP checker: str(parameters.account_id) ('''' when absent)'
      args.account_id.length:
        type: int
        source: 'PDP checker: len(parameters.account_id) when text, else 0'
